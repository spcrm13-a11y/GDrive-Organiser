# ainie-knowfind edge -- one hostname per app, per
# SP-nginx/docs/per-app-hostnames.md.
#
# Tailscale Serve in the knowfind-tailscale sidecar terminates TLS with that
# node's own Let's Encrypt certificate and proxies here over plain HTTP, so
# $scheme is "http" on every request that lands here and must not be used to
# build redirects: the browser spoke https. https is hardcoded below, which is
# correct precisely because this block is only ever reachable via Serve.
#
# There is deliberately no :84xx TLS block and no theguardian.tail2227aa.ts.net
# server_name here. This app was born on its own hostname, so it never joins
# the shared cookie jar that produced the 2026-10-04 "HTTP ERROR 400" incident
# (twenty apps on one host, every app's authentik_proxy_* cookie sent to all of
# them, past nginx's 8 KB header ceiling).

server {
  listen 80;
  server_name knowfind.tail2227aa.ts.net;

  # Docker's embedded DNS, with a short TTL so a restarted upstream is picked
  # up without reloading nginx. Required by the `set $knowfind_app` indirection
  # below.
  resolver 127.0.0.11 valid=10s;

  # Headroom only. On a dedicated hostname the Cookie header carries this app's
  # session alone, so this is not load-bearing the way it is on the shared host.
  large_client_header_buffers 8 32k;

  # The classifier accepts pasted full documents on /api/classify-batch, and
  # server.ts allows a 15 MB JSON body -- nginx must not reject it first.
  client_max_body_size 15m;

  # The outpost is reached through a variable, like the app below, so nginx
  # re-resolves it via the resolver above instead of caching one IP at config
  # load. With a literal name a recreated outpost container keeps the edge
  # dialing the dead IP: "connect() failed (111: Connection refused)" ->
  # "auth request unexpected status: 502" -> a bare 500 to the browser, with
  # nothing naming the real cause. Measured here on 2026-10-15.
  #
  # A proxy_pass containing variables does not get the remaining request URI
  # appended, so every URI is spelled out explicitly below.
  set $knowfind_outpost http://knowfind-authentik-outpost:9000;

  location = /outpost.goauthentik.io/callback {
    proxy_pass $knowfind_outpost/outpost.goauthentik.io/callback$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URL https://$http_host$request_uri;
    auth_request_set $auth_cookie $upstream_http_set_cookie;
    add_header Set-Cookie $auth_cookie;
    add_header Cache-Control "no-store" always;
    # The outpost's state cookie carries Max-Age=3601. Begin a sign-in, come
    # back over an hour later, and the cookie is gone while the callback URL in
    # the address bar is not -- the outpost then answers a bare 400 with no way
    # forward, and retrying replays the same dead state.
    proxy_intercept_errors on;
    error_page 400 = @knowfind_stale_state;
  }

  location /outpost.goauthentik.io/ {
    # $uri, not $request_uri: in the auth_request subrequest $request_uri is
    # still the parent request's, which would send the outpost the app's path
    # instead of /outpost.goauthentik.io/auth/nginx. The upstream path is
    # identical to the incoming one, so no prefix rewriting is needed.
    proxy_pass $knowfind_outpost$uri$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URL https://$http_host$request_uri;
    auth_request_set $auth_cookie $upstream_http_set_cookie;
    add_header Set-Cookie $auth_cookie;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }

  location @knowfind_stale_state {
    internal;
    add_header Cache-Control "no-store" always;
    default_type text/html;
    # Restart the sign-in once. The ?relogin=1 marker stops this bouncing
    # between here and Authentik forever when the cause is not an expired
    # cookie -- a loop would hide the real fault behind a spinning browser.
    if ($arg_relogin) {
      return 400 '<h3>Sign-in could not be completed</h3><p>The sign-in session expired, or the browser did not return the state cookie. Close this tab, open a new one, and go to https://knowfind.tail2227aa.ts.net/ again.</p>';
    }
    return 302 https://$http_host/?relogin=1;
  }

  location @knowfind_signin {
    internal;
    add_header Set-Cookie $auth_cookie;
    # A cached sign-in redirect replays a dead state forever.
    add_header Cache-Control "no-store" always;
    return 302 https://$http_host/outpost.goauthentik.io/start?rd=https://$http_host$request_uri;
  }

  location / {
    auth_request /outpost.goauthentik.io/auth/nginx;
    auth_request_set $auth_cookie $upstream_http_set_cookie;
    auth_request_set $authentik_username $upstream_http_x_authentik_username;
    auth_request_set $authentik_name $upstream_http_x_authentik_name;
    auth_request_set $authentik_email $upstream_http_x_authentik_email;
    auth_request_set $authentik_groups $upstream_http_x_authentik_groups;
    add_header Set-Cookie $auth_cookie;
    error_page 401 = @knowfind_signin;

    # Via a variable so nginx starts even when the app container is not up yet
    # (a literal upstream name is resolved at config load and fails hard).
    set $knowfind_app http://ainie-knowfind-app:3000;
    proxy_pass $knowfind_app;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # The trusted-proxy marker: the app must not believe the X-Authentik-*
    # headers below without it, since a client could otherwise send its own.
    proxy_set_header X-Knowfind-Authenticated "1";
    proxy_set_header X-Authentik-Username $authentik_username;
    proxy_set_header X-Authentik-Name $authentik_name;
    proxy_set_header X-Authentik-Email $authentik_email;
    proxy_set_header X-Authentik-Groups $authentik_groups;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
